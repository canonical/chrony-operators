project: chrony-operators
path: /home/ubuntu/proj
kill-timeout: 60m
warn-timeout: 1m
backends:
  integration-test:
    type: integration-test
    systems:
    - ubuntu-24.04:
        runner: [self-hosted, linux, X64, noble, large]
environment:
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-main}")'
  CONCIERGE: concierge.yaml
exclude:
- .git
- .tox
- .venv
- .*_cache
integration-suites:
  tests/integration/:
    summary: chrony charms integration tests
    working-dir: ./
    backends:
    - integration-test
    systems: [ubuntu-24.04]
    pytest-arguments-template: |
      --model testing
      --keep-models

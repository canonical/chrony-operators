[project]
name = "chrony-shared"
version = "0.0.0"
description = "Code shared between the Chrony charms."
requires-python = ">=3.10"
dependencies = [
  "cosl==1.11.3",
  "jsonschema==4.26.0",
  "opentelemetry-api==1.45.2",
  "ops==3.9.0",
  "pydantic==2.14.2",
]

[build-system]
requires = [ "setuptools>=64" ]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [ "chrony", "keychain" ]

[project]
name = "chrony-shared"
version = "0.0.0"
description = "Code shared between the Chrony charms."
requires-python = ">=3.10"
dependencies = [
  "cosl==1.10.2",
  "cryptography==50.0.0",
  "jsonschema==4.26.0",
  "opentelemetry-api==1.44.0",
  "ops==3.8.1",
  "pydantic==2.13.4",
]

[build-system]
requires = [ "setuptools>=64" ]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [ "chrony", "keychain" ]
